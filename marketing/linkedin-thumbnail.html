<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markly LinkedIn Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* 1920x1080 thumbnail for the LinkedIn video. Same paper/ink/highlighter world as markly-promo.html. */
@font-face{font-family:'Virgil';src:url('../public/fonts/Virgil.woff2') format('woff2')}
:root{
  --paper:#f4f2ec; --sheet:#fffefb; --ink:#161513; --ink2:#5c5952; --ink3:#a19d93;
  --rule:#e2ded4; --bar:#d9d5ca; --hl:#ffd43b;
  --ui:'Inter',system-ui,'Segoe UI',sans-serif;
  --hand:'Virgil','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:var(--ui);
  background:var(--paper) radial-gradient(circle,#dcd8cd 1.6px,transparent 2px) 0 0/32px 32px}

/* Left column */
.copy{position:absolute;left:130px;top:0;bottom:0;width:800px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;font:800 58px/1 var(--ui);letter-spacing:-2px}
.quote{margin-top:70px;font:400 54px/1.25 var(--hand);color:var(--ink2)}
.quote .ln{position:relative;display:inline-block}
.quote .ln svg{position:absolute;left:-6px;right:-6px;top:36%;width:calc(100% + 12px);height:34px;overflow:visible}
.headline{position:relative;isolation:isolate;margin-top:34px;font:800 156px/1 var(--ui);letter-spacing:-6px}
.hl{position:relative;white-space:nowrap}
.hl::before{content:"";position:absolute;left:-12px;right:-16px;top:46%;bottom:2%;z-index:-1;background:var(--hl);
  border-radius:8px 18px 10px 16px;transform:rotate(-1.6deg) skewX(-8deg)}
.sub{margin-top:46px;font:500 40px/1.4 var(--ui);color:var(--ink2);letter-spacing:-.5px}

/* Right: document */
.sheet{position:absolute;left:1030px;top:150px;width:760px;height:840px;background:var(--sheet);border-radius:18px;
  box-shadow:0 44px 110px rgba(22,21,19,.16),0 0 0 1.5px var(--rule)}
.sheet.back{left:1052px;top:168px;background:#fbfaf6;transform:rotate(3.5deg);box-shadow:0 20px 60px rgba(22,21,19,.08),0 0 0 1.5px var(--rule)}
.sheet .pill{position:absolute;right:40px;top:44px;font:600 24px/1 var(--ui);color:var(--ink2);background:var(--paper);
  border:1.5px solid var(--rule);border-radius:999px;padding:10px 18px}
.sheet .title{position:absolute;left:64px;top:52px;font:800 42px/1 var(--ui);letter-spacing:-1px}
.sheet .h{position:absolute;left:64px;font:700 28px/1 var(--ui);color:var(--ink)}
.bar{position:absolute;left:64px;height:14px;border-radius:7px;background:var(--rule)}
.bar.dark{background:var(--bar)}
.sheet svg.ann{position:absolute;inset:0;overflow:visible}

/* Toolbar */
.tools{position:absolute;left:1186px;top:96px;display:flex;gap:10px;padding:12px;background:var(--sheet);border-radius:20px;
  box-shadow:0 18px 44px rgba(22,21,19,.14),0 0 0 1.5px var(--rule)}
.tools span{width:56px;height:56px;border-radius:13px;display:grid;place-items:center}
.tools span.on{background:var(--hl)}

/* Comment + cursor */
.bubble{position:absolute;left:1268px;top:842px;width:500px;background:var(--sheet);border-radius:20px;padding:22px 26px;
  box-shadow:0 26px 70px rgba(22,21,19,.18),0 0 0 1.5px var(--rule)}
.bubble .who{display:flex;align-items:center;gap:14px;font:700 26px/1 var(--ui)}
.bubble .who i{font-style:normal;font-weight:500;color:var(--ink3);font-size:22px}
.av{width:48px;height:48px;border-radius:50%;background:#3d3b36;color:var(--sheet);display:grid;place-items:center;font:700 24px/1 var(--ui)}
.bubble p{margin-top:14px;font:500 31px/1.3 var(--ui);letter-spacing:-.3px}
.cur{position:absolute;left:1456px;top:764px}
svg.over{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
</style>
</head>
<body>
<div class="stage">

  <div class="copy">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 40 40" fill="none" stroke="#161513" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 L8 6 L8 20" stroke-width="2.8"/><path d="M20 34 L32 34 L32 20" stroke-width="2.8"/>
        <path d="M13 20 Q17 18 20 20 Q23 22 27 20" stroke-width="1.5"/><circle cx="20" cy="20" r="3.5" fill="#161513" stroke="none"/>
      </svg>
      Markly
    </div>

    <div class="quote">
      <span class="ln">"page 3, second para...<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M1 12 C 22 7, 40 15, 62 9 S 90 13, 99 8" stroke="#161513" stroke-width="4" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span><br>
      <span class="ln">no, the other one."<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M1 9 C 20 14, 45 6, 66 12 S 92 7, 99 11" stroke="#161513" stroke-width="4" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span>
    </div>

    <h1 class="headline">Just <span class="hl">point</span><br>at it.</h1>

    <p class="sub">Draw on any PDF, share one link,<br>and get feedback right on the page.</p>
  </div>

  <div class="sheet back"></div>
  <div class="sheet">
    <div class="title">Project Proposal</div>
    <div class="pill">Page 3 of 8</div>
    <div class="bar dark" style="top:118px;width:250px"></div>

    <div class="h" style="top:186px">2. Timeline</div>
    <div class="bar" style="top:246px;width:610px"></div>
    <div class="bar" style="top:290px;width:560px"></div>
    <div class="bar" style="top:334px;width:620px"></div>
    <div class="bar" style="top:378px;width:420px"></div>

    <div class="h" style="top:452px">3. Budget</div>
    <div class="bar" style="top:512px;width:600px"></div>
    <div class="bar" style="top:556px;width:340px"></div>
    <div class="bar" style="top:600px;width:340px"></div>
    <div class="bar" style="top:644px;width:580px"></div>
    <div class="bar" style="top:688px;width:610px"></div>
    <div class="bar" style="top:732px;width:300px"></div>

    <svg class="ann" width="760" height="840" viewBox="0 0 760 840">
      <!-- highlighter over a Timeline line -->
      <path d="M54 278 L630 274 L632 314 L56 318 Z" fill="#ffd43b" style="mix-blend-mode:multiply" stroke="#ffd43b" stroke-width="6" stroke-linejoin="round"/>
      <!-- hand-drawn ellipse around "the other one" -->
      <g fill="none" stroke="#161513" stroke-linecap="round">
        <path d="M62 598 C 64 622, 150 633, 240 632 C 350 631, 434 622, 436 605 C 438 588, 350 580, 236 581 C 130 582, 42 588, 46 606 C 49 620, 110 630, 190 635" stroke-width="4.2"/>
        <path d="M70 602 C 76 620, 160 628, 246 627 C 352 626, 428 616, 428 602" stroke-width="2" opacity=".5"/>
      </g>
    </svg>
  </div>

  <div class="tools">
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2" stroke-linejoin="round"><path d="M5 3 L5 19 L9.5 14.8 L12.5 21 L15 19.8 L12 13.6 L18 13.3 Z"/></svg></span>
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></span>
    <span class="on"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></span>
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 L19 5 M11 5 H19 V13"/></svg></span>
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h7"/><path d="M14.5 4.5 l5 5 -8 8 h-5 v-5 z"/></svg></span>
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 C 7 9, 10 19, 14 11 S 19 7, 21 9"/></svg></span>
    <span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2.2" stroke-linecap="round"><path d="M6 5h12M12 5v14"/></svg></span>
  </div>

  <!-- arrow from the comment up to the circled line -->
  <svg class="over" viewBox="0 0 1920 1080">
    <g fill="none" stroke="#161513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1296 838 C 1262 822, 1258 806, 1296 794"/>
      <path d="M1274 791 L1296 794 L1282 811"/>
    </g>
  </svg>

  <div class="bubble">
    <div class="who"><span class="av">R</span>Reviewer <i>just now</i></div>
    <p>This one. Not the line above.</p>
  </div>

  <div class="cur">
    <svg width="54" height="60" viewBox="0 0 42 46"><path d="M4 3 L4 34 L12.5 26 L18 39 L24 36.5 L18.5 24 L29.5 23.5 Z" fill="#161513" stroke="#fffefb" stroke-width="2.6" stroke-linejoin="round"/></svg>
  </div>

</div>
</body>
</html>
